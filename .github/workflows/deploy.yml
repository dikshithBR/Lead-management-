name: Deploy to Firebase Hosting on Merge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - run: node -e 'try { const sa = JSON.parse(process.env.SA); console.log("::notice::Using Service Account Email -> " + sa.client_email + " for project -> " + sa.project_id); } catch(e) { console.log("::error::Invalid JSON in FIREBASE_SERVICE_ACCOUNT"); }'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          npx firebase-tools deploy --only hosting --project leadmanagement-bdb13
